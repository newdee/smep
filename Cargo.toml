[package]
name = "smep"
version = "0.1.6"
edition = "2024"
rust-version = "1.97"
description = "A Simple Markdown Editor & Previewer, written in Rust"
readme = "README.md"
repository = "https://github.com/newdee/smep"
homepage = "https://github.com/newdee/smep"
license = "MIT OR Apache-2.0"
keywords = ["markdown", "editor", "preview", "gui", "gpui"]
categories = ["text-editors"]
include = ["src/**", "tests/**", "assets/themes/*", "Cargo.toml", "README.md", "LICENSE-*"]

[features]
default = ["pdf-import", "pdf-export"]
# Sizes are of the Windows release binary (docs/qa/phase5.md).
# PDF → Markdown (pdf-inspector): ~7 MB of binary.
pdf-import = ["dep:pdf-inspector"]
# Markdown → PDF: Typst typesets the document with the system's fonts
# (Typst's own fonts would add ~10 MB for Latin text alone, and every
# platform ships fonts). ~34 MB of binary.
pdf-export = ["dep:typst-as-lib", "dep:typst-layout", "dep:typst-pdf"]

[dependencies]
anyhow = "1"
dirs = "6"
docx-rust = "0.1"
futures = "0.3"
gpui-kit = "0.6"
htmd = "0.5"
markdown = "1"
pdf-inspector = { version = "1.25", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
typst-as-lib = { version = "0.16", features = ["typst-kit-fonts"], optional = true }
typst-layout = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }

# Becoming the default app for .md: the registry on Windows, LaunchServices
# on macOS (both already in the dependency tree through gpui).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# AttachConsole, so a GUI-subsystem smep.exe still prints --version in a
# terminal; CREATE_NO_WINDOW, so the cmd it runs for Settings shows no console.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
serde_json = "1"

[profile.release]
# One small static binary is a project goal; symbols alone were 30 MB on
# Linux, and link-time optimisation takes a further fifth off with Typst
# in (fat LTO saves a little more but triples the build time).
strip = true
lto = "thin"
codegen-units = 1
