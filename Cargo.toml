[package]
name = "smep"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A Simple Markdown Editor & Previewer, written in Rust"
readme = "README.md"
repository = "https://github.com/newdee/smep"
homepage = "https://github.com/newdee/smep"
license = "MIT OR Apache-2.0"
keywords = ["markdown", "editor", "preview", "gui", "gpui"]
categories = ["text-editors"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[dependencies]
anyhow = "1"
dirs = "6"
futures = "0.3"
gpui-kit = "0.6"
markdown = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }

[profile.release]
# One small static binary is a project goal; symbols alone were 30 MB on Linux.
strip = true
